spring.config.import=optional:file:.env.dev[.properties]
# JPA, Hibernate
# DDL Auto (스키마 관리 -> create는 관리상 문제가 있어 최소 update로 해야함)
spring.jpa.hibernate.ddl-auto=update
# SQL 로그에 표시 & 포맷팅 (디버깅)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Datasource
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# AI 인증키
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=openai/gpt-oss-120b
spring.ai.openai.chat.temperature=0.4
spring.ai.openai.chat.max-tokens=2048