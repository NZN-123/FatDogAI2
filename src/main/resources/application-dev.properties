spring.config.import=optional:file:.env.dev[.properties]
# JPA, Hibernate
# DDL Auto (스키마 관리 -> create는 관리상 문제가 있어 최소 update로 해야함)
spring.jpa.hibernate.ddl-auto=update
# SQL 로그에 표시 & 포맷팅 (디버깅)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Datasource - H2 in-memory
spring.datasource.url=jdbc:h2:mem:fatdogai2;DB_CLOSE_DELAY=-1

spring.ai.openai.api-key=${GEMINI_API_KEY:no-api-key}

#gemini setting
spring.ai.google.genai.api-key=${GEMINI_API_KEY:no-api-key}

spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.temperature=0.7
spring.ai.google.genai.chat.max-output-tokens=1024