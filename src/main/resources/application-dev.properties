spring.config.import=optional:file:.env.dev[.properties]
# 인증키 (google.genai는 빈 값 시 구동 자체가 안 되어서 무의미한 텍스트 기본값 필수)
spring.ai.openai.api-key=${GROQ_API_KEY:no-api-key}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:no-api-key}
# groq 관련 설정
# https://console.groq.com/keys -> .env.dev -> GROQ_API_KEY -> spring.config.import -> openai.api-key
# https://console.groq.com/docs/openai
spring.ai.openai.base-url=https://api.groq.com/openai/v1
# spring.ai.openai.model=gpt-5-mini # openai(chatgpt) -> groq
# https://console.groq.com/docs/rate-limits
spring.ai.openai.chat.model=openai/gpt-oss-120b
spring.ai.openai.chat.temperature=0.7
spring.ai.openai.chat.max-tokens=1024
# gemini 관련 설정
# https://aistudio.google.com/api-keys
# https://aistudio.google.com/prompts/new_chat
# https://aistudio.google.com/rate-limit?timeRange=last-1-day
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
# spring.ai.google.genai.chat.model=gemini-3.1-flash-lite
spring.ai.google.genai.chat.temperature=0.7
spring.ai.google.genai.chat.max-output-tokens=1024
# nim 관련 설정
# https://build.nvidia.com/settings/api-keys
spring.ai.nim.api-key=${NIM_API_KEY}
spring.ai.nim.base-url=https://integrate.api.nvidia.com/v1
spring.ai.nim.chat.model=deepseek-ai/deepseek-v4-flash
