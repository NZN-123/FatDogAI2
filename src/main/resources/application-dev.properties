spring.config.import=optional:file:.env.dev[.properties]

# JPA, Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Datasource - MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Spring AI keys with fallback defaults to allow local startup
spring.ai.openai.api-key=${GROQ_API_KEY:dummy-key-for-startup}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:dummy-key-for-startup}
spring.ai.nim.api-key=${NIM_API_KEY:dummy-key-for-startup}

# Groq (OpenAI-compatible) configuration
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=openai/gpt-oss-120b
spring.ai.openai.chat.temperature=0.4
spring.ai.openai.chat.max-tokens=4096

# NIM configuration
spring.ai.nim.base-url=https://integrate.api.nvidia.com/v1
spring.ai.nim.chat.model=deepseek-ai/deepseek-v4-flash
